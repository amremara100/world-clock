<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: transparent; display: flex; justify-content: center; align-items: center; padding: 5px; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 800px; }
        .card { background-color: rgba(59, 66, 82, 0.85); border-radius: 20px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #d8dee9; text-align: center; }
        .card.dark { background-color: rgba(46, 52, 64, 0.85); }
        .city { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .time { font-size: 28px; font-weight: 300; letter-spacing: 1px; margin-bottom: 2px; }
        .ampm-day { font-size: 11px; color: #b0b8c8; }
        @media (max-width: 400px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="grid-container" id="clock-grid"></div>
    <script>
        const cities = [
            { name: "Zürich", tz: "Europe/Zurich", dark: false }, { name: "Dubai", tz: "Asia/Dubai", dark: false },
            { name: "Barcelona", tz: "Europe/Madrid", dark: false }, { name: "Cairo", tz: "Africa/Cairo", dark: false },
            { name: "Mumbai", tz: "Asia/Kolkata", dark: false }, { name: "Amman", tz: "Asia/Amman", dark: false },
            { name: "Hong Kong", tz: "Asia/Hong_Kong", dark: true }, { name: "Washington", tz: "America/New_York", dark: true },
            { name: "Sydney", tz: "Australia/Sydney", dark: true }, { name: "California", tz: "America/Los_Angeles", dark: true },
            { name: "Brussels", tz: "Europe/Brussels", dark: false }, { name: "London", tz: "Europe/London", dark: false }
        ];

        const grid = document.getElementById('clock-grid');
        cities.forEach(city => {
            const card = document.createElement('div');
            card.className = `card ${city.dark ? 'dark' : ''}`;
            card.innerHTML = `<div class="city">${city.name}</div><div class="time" id="time-${city.name.replace(/\s/g, '')}">--:--</div><div class="ampm-day" id="day-${city.name.replace(/\s/g, '')}">-- / ---</div>`;
            grid.appendChild(card);
        });

        function updateTime() {
            const now = new Date(); // بيجيب وقت الموبايل الحالي فوراً
            cities.forEach(city => {
                const timeElement = document.getElementById(`time-${city.name.replace(/\s/g, '')}`);
                const dayElement = document.getElementById(`day-${city.name.replace(/\s/g, '')}`);
                
                // استخدام الدوال دي بيجبر المتصفح يقرأ الوقت الحالي مهما كان مجمد
                const timeString = now.toLocaleTimeString('en-US', { timeZone: city.tz, hour: 'numeric', minute: '2-digit', hour12: true });
                const dayString = now.toLocaleDateString('en-US', { timeZone: city.tz, weekday: 'short' });
                
                const [time, ampm] = timeString.split(' ');
                timeElement.textContent = time;
                dayElement.textContent = `${ampm} / ${dayString}`;
            });
        }

        // 1. تحديث كل ثانية (ده اللي بيخليها تظبط فوراً لما الشاشة تولع)
        setInterval(updateTime, 1000);

        // 2. محاولة إجبار النظام على التحديث لما الشاشة تولع
        window.addEventListener('focus', updateTime);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                updateTime();
            }
        });
        
        // 3. التحديث عند لمس الشاشة أو تحريك الموبايل
        document.addEventListener('touchstart', updateTime);

        updateTime(); // التشغيل الأول
    </script>
</body>
</html>
